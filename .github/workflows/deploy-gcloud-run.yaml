name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'src/**'
      - 'Dockerfile'
      - 'cloudbuild.yaml'
      - 'gcloud-run.yaml'
      - '.github/workflows/deploy-gcloud-run.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: "${{ env.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        if: "${{ env.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        if: "${{ env.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Container Image
        if: "${{ env.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/${PROJECT_ID}/cct-cloud-drive/app"
          docker build -t "${IMAGE_URI}:${{ github.sha }}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${{ github.sha }}"
          docker push "${IMAGE_URI}:latest"

      - name: Deploy to Cloud Run (Always Free Tier)
        if: "${{ env.GCP_SA_KEY != '' }}"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          IMAGE_URI="us-central1-docker.pkg.dev/${PROJECT_ID}/cct-cloud-drive/app:${{ github.sha }}"
          gcloud run deploy cct-cloud-drive \
            --image="${IMAGE_URI}" \
            --region=us-central1 \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --port=8080 \
            --set-env-vars="SPRING_PROFILES_ACTIVE=gcloud"
