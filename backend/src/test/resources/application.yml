spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  storage:
    base-dir: ./target/test-storage
    default-quota-bytes: 524288000
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  security:
    recaptcha:
      enabled: false
