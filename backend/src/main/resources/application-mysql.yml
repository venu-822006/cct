server:
  port: 8080

spring:
  application:
    name: personal-cloud-drive
  datasource:
    url: jdbc:mysql://localhost:3306/clouddrive_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driverClassName: com.mysql.cj.jdbc.Driver
    username: root
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  storage:
    base-dir: ./storage_root
    default-quota-bytes: 524288000 # 500 MB per user
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A
    expiration-ms: 86400000 # 24 hours
