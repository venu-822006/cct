server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: personal-cloud-drive

  # ── Datasource: Persistent H2 by default (zero-billing), or Cloud SQL when configured
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/clouddrivedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  # H2 console
  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

app:
  storage:
    type: ${STORAGE_TYPE:local}
    base-dir: ${APP_STORAGE_BASE_DIR:./storage_root}
    gcs-bucket: ${GCS_BUCKET:}
    default-quota-bytes: ${APP_STORAGE_QUOTA:5368709120} # 5 GB per user

  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours (1 full day)

  security:
    recaptcha:
      enabled: ${RECAPTCHA_ENABLED:true}
      site-key: ${RECAPTCHA_SITE_KEY:0x4AAAAAAGPGssbXL8tJpeUa}
      secret-key: ${RECAPTCHA_SECRET_KEY:0x4AAAAAAGPGsoZ9R0IzIhtmpYKaF5OiuAY}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login-limit: ${RATE_LIMIT_LOGIN:10} # max 10 login attempts per minute per IP
      register-limit: ${RATE_LIMIT_REGISTER:5} # max 5 registration attempts per minute per IP
      window-seconds: 60

logging:
  level:
    com.clouddrive: INFO
    org.springframework.web: INFO
