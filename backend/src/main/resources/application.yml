server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: personal-cloud-drive
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/clouddrivedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

app:
  storage:
    base-dir: ${APP_STORAGE_BASE_DIR:./storage_root}
    default-quota-bytes: 524288000 # 500 MB per user
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours (1 full day)
  security:
    rate-limit:
      enabled: true
      login-limit: 10 # max 10 login attempts per minute per IP
      register-limit: 5 # max 5 registration attempts per minute per IP
      window-seconds: 60
