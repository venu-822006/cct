version: '3.8'

# ===================================================================
# Cloudflare Zero Trust Tunnel Daemon (100% Free Cloud Service)
# Replaces manual port-forwarding and ephemeral shell sessions.
# Automatically reconnects and stays alive in the background.
# ===================================================================

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cct-cloudflare-tunnel
    restart: always
    environment:
      # Obtain TUNNEL_TOKEN from Cloudflare Zero Trust Dashboard -> Networks -> Tunnels
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
