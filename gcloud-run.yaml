apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: cct-cloud-drive
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
    run.googleapis.com/description: "Personal Cloud Drive on Google Cloud Run Free Tier"
spec:
  template:
    metadata:
      name: cct-cloud-drive-v1
      annotations:
        # Scale to 0 instances when idle: $0.00 cost (Google Cloud Run Always Free Tier)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        # CPU throttled when not handling requests to stay strictly within free tier
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: cloud-drive
          image: us-central1-docker.pkg.dev/PROJECT_ID/cct-cloud-drive/app:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "gcloud"
            - name: PORT
              value: "8080"
            - name: APP_STORAGE_BASE_DIR
              value: "/app/storage_root"
            - name: RECAPTCHA_ENABLED
              value: "true"
            - name: TURNSTILE_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
